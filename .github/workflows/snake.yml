name: generate fire snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: setup node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: pusidun
          outputs: |
            dist/raw-snake.svg

      - name: apply fire effect
        run: node scripts/fireify.js

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist-final
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}